{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block auth_content %}
<div class="auth-card" style="max-width:500px;">
    <div class="auth-logo">
        <i class="bi bi-person-plus"></i>
    </div>
    <div class="text-center mb-4">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join the Skill Gap Tracking System</p>
    </div>

    <!-- Error Alert -->
    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2" role="alert" style="font-size:13.5px;">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
        <!-- CSRF Token -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="row g-3">
            <!-- Full Name -->
            <div class="col-12">
                <label class="form-label" for="full_name">Full Name</label>
                <input type="text" class="form-control" id="full_name" name="full_name"
                       placeholder="Nimish Tiwari" required autofocus
                       value="{{ form_data.get('full_name', '') }}">
            </div>

            <!-- Email -->
            <div class="col-12">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="you@college.edu" required
                       value="{{ form_data.get('email', '') }}">
            </div>

            <!-- Roll Number -->
            <div class="col-md-6">
                <label class="form-label" for="roll_number">Roll Number</label>
                <input type="text" class="form-control" id="roll_number" name="roll_number"
                       placeholder="22CS001" required
                       value="{{ form_data.get('roll_number', '') }}">
            </div>

            <!-- Branch -->
            <div class="col-md-6">
                <label class="form-label" for="branch">Branch</label>
                <select class="form-control" id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                    {% set branches = [
                        'Computer Science',
                        'Information Technology',
                        'Electronics',
                        'Mechanical',
                        'Civil',
                        'Electrical'
                    ] %}
                    {% for b in branches %}
                    <option value="{{ b }}" {% if form_data.get('branch') == b %}selected{% endif %}>
                        {{ b }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Password -->
            <div class="col-12">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Min 8 characters" required minlength="8">
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd"
                            style="border-color: var(--border-color);">
                        <i class="bi bi-eye" id="togglePwdIcon"></i>
                    </button>
                </div>
                <!-- Password strength indicator -->
                <div class="mt-1" id="pwd-strength" style="display:none; font-size:12px;"></div>
            </div>

            <!-- Confirm Password -->
            <div class="col-12">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter your password" required minlength="8">
                <div id="pwd-match-msg" style="font-size:12px; margin-top:4px;"></div>
            </div>

            <!-- Submit -->
            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-primary w-100 py-2" id="register-btn">
                    <i class="bi bi-person-check me-2"></i>Create Account
                </button>
            </div>
        </div>
    </form>

    <hr class="my-3">
    <p class="text-center text-muted mb-0" style="font-size:13px;">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-600">Sign in</a>
    </p>
</div>

<script>
// Password toggle
document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('togglePwdIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
});

// Password strength indicator
document.getElementById('password').addEventListener('input', function () {
    const val = this.value;
    const el = document.getElementById('pwd-strength');
    if (!val) { el.style.display = 'none'; return; }
    el.style.display = 'block';

    let strength = 0;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    const labels = ['Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#22c55e'];
    el.textContent = '🔒 Strength: ' + (labels[strength - 1] || 'Weak');
    el.style.color = colors[strength - 1] || '#ef4444';
});

// Password match check
document.getElementById('confirm_password').addEventListener('input', function () {
    const pwd = document.getElementById('password').value;
    const msg = document.getElementById('pwd-match-msg');
    if (this.value === pwd) {
        msg.textContent = '✓ Passwords match';
        msg.style.color = '#22c55e';
    } else {
        msg.textContent = '✗ Passwords do not match';
        msg.style.color = '#ef4444';
    }
});
</script>
{% endblock %}
